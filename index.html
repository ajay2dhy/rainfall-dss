<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Rainfall DSS</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root {
    --bg: #f7f8f3;
    --panel: #ffffff;
    --ink: #18211f;
    --muted: #5e6b66;
    --line: #d8ded8;
    --green: #1f7a4d;
    --amber: #f2b705;
    --orange: #e67e22;
    --red: #c93a3a;
    --purple: #7d3c98;
    --blue: #9bd7f0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    width: min(1440px, calc(100% - 32px));
    margin: 0 auto;
    padding: 22px 0 28px;
}

.topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
}

h1 {
    margin: 0;
    font-size: 26px;
    line-height: 1.15;
}

.meta {
    color: var(--muted);
    font-size: 13px;
    text-align: right;
}

.controls {
    display: grid;
    grid-template-columns: minmax(220px, 1.4fr) minmax(160px, 0.8fr) minmax(180px, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}

input,
select {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    font-size: 14px;
    padding: 8px 10px;
}

input:focus,
select:focus {
    border-color: var(--green);
    outline: 2px solid rgba(31, 122, 77, 0.18);
}

.stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
}

.stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 70px;
}

.stat span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
}

.stat strong {
    display: block;
    font-size: 22px;
    line-height: 1.1;
}

.workspace {
    display: grid;
    grid-template-columns: minmax(360px, 0.95fr) minmax(420px, 1.05fr);
    gap: 14px;
    align-items: start;
}

.map-wrap,
.table-wrap {
    min-width: 0;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 8px;
    font-size: 17px;
}

.section-title small {
    color: var(--muted);
    font-size: 12px;
    font-weight: normal;
}

#map {
    height: 620px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #dbe8df;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
}

.legend span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.swatch {
    width: 14px;
    height: 14px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    border-radius: 3px;
}

.table-scroll {
    max-height: 372px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

th,
td {
    border-bottom: 1px solid #edf0ed;
    padding: 8px 9px;
    text-align: left;
    white-space: nowrap;
}

th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #22312b;
    color: #ffffff;
    font-weight: 600;
}

tbody tr:nth-child(even) {
    background: #fafbf8;
}

tbody tr:hover {
    background: #eef6ef;
}

tbody tr.selected-row {
    background: #dff1e2;
    outline: 2px solid rgba(31, 122, 77, 0.28);
    outline-offset: -2px;
}

.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
}

.alert {
    border-radius: 4px;
    color: #1b1b1b;
    font-weight: 700;
    padding: 4px 6px;
}

.alert-none {
    color: var(--muted);
    font-weight: normal;
}

.alert-moderate {
    background: #f8df6d;
}

.alert-heavy {
    background: var(--orange);
}

.alert-very-heavy {
    background: var(--red);
    color: #ffffff;
}

.alert-extremely-heavy {
    background: var(--purple);
    color: #ffffff;
}

.status {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 13px;
}

.error {
    color: var(--red);
    font-weight: 700;
}

.hydro-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
    padding: 12px;
}

.selected-summary {
    color: var(--muted);
    font-size: 13px;
    min-height: 18px;
    margin: -2px 0 8px;
}

.chart-box {
    height: 230px;
    min-height: 230px;
}

.chart-surface {
    width: 100%;
    height: 100%;
    border: 1px solid #edf0ed;
    border-radius: 6px;
    background: #fbfcfa;
    overflow: hidden;
}

.chart-surface svg {
    display: block;
    width: 100%;
    height: 100%;
}

.chart-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 16px;
}

.distribution-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
}

button {
    min-height: 34px;
    border: 1px solid var(--green);
    border-radius: 6px;
    background: var(--green);
    color: #ffffff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 10px;
}

button:disabled {
    border-color: var(--line);
    background: #e8ece8;
    color: var(--muted);
    cursor: not-allowed;
}

@media (max-width: 1000px) {
    .workspace,
    .controls,
    .stats {
        grid-template-columns: 1fr;
    }

    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .meta {
        text-align: left;
    }

    #map {
        height: 520px;
    }
}
</style>
</head>

<body>
<main class="app">
    <div class="topbar">
        <div>
            <h1>India Rainfall Forecast DSS</h1>
            <div class="status" id="status">Loading forecast data...</div>
        </div>
        <div class="meta" id="meta"></div>
    </div>

    <div class="controls">
        <input type="search" id="searchBox" placeholder="Search district, state, or basin">
        <select id="filterBox">
            <option value="ALL">All districts</option>
            <option value="ALERT">Only alerts</option>
            <option value="MODERATE">Moderate and above</option>
            <option value="HEAVY">Heavy and above</option>
            <option value="RAIN50">Bias-corrected rainfall > 50 mm</option>
        </select>
        <select id="basinBox">
            <option value="ALL">All basins</option>
        </select>
    </div>

    <section class="stats" aria-label="Forecast summary">
        <div class="stat"><span>Total districts</span><strong id="totalCount">0</strong></div>
        <div class="stat"><span>Visible districts</span><strong id="visibleCount">0</strong></div>
        <div class="stat"><span>Alert districts</span><strong id="alertCount">0</strong></div>
        <div class="stat"><span>Maximum rainfall</span><strong id="maxRain">0 mm</strong></div>
        <div class="stat"><span>Top district</span><strong id="topDistrict">-</strong></div>
    </section>

    <section class="workspace">
        <div class="map-wrap">
            <h2 class="section-title">Rainfall Map <small id="mapNote"></small></h2>
            <div id="map"></div>
            <div class="legend">
                <span><i class="swatch" style="background: var(--purple);"></i>&gt;150 mm</span>
                <span><i class="swatch" style="background: var(--red);"></i>75-150 mm</span>
                <span><i class="swatch" style="background: var(--orange);"></i>30-75 mm</span>
                <span><i class="swatch" style="background: var(--amber);"></i>5-30 mm</span>
                <span><i class="swatch" style="background: var(--blue);"></i>&lt;=5 mm</span>
            </div>
        </div>

        <div class="table-wrap">
            <div class="hydro-panel">
                <h2 class="section-title">3-hour Rainfall Distribution <small id="distributionNote"></small></h2>
                <div class="selected-summary" id="selectedDistrictSummary">Select a district to view distribution.</div>
                <div class="chart-box">
                    <div id="distributionChart" class="chart-surface"></div>
                </div>
                <div class="distribution-actions">
                    <button type="button" id="downloadDistrictDistribution" disabled>Download district CSV</button>
                    <button type="button" id="downloadAllDistribution" disabled>Download all CSV</button>
                </div>
            </div>

            <h2 class="section-title">District Forecasts <small id="tableNote"></small></h2>
            <div class="table-scroll">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script>
const DATA_CSV = "India_24h_GFS_IMD_ICON_Rainfall.csv";
const DISTRIBUTION_CSV = "India_3h_GFS_IMD_ICON_Rainfall.csv";
const BASIN_CSV = "district_basin_mapping.csv";
const DISTRICTS_GEOJSON = "india_districts.geojson";
const DATA_CACHE_BUSTER = Date.now().toString();

const columns = [
    { key: "state", label: "State" },
    { key: "district", label: "District" },
    { key: "basin", label: "Basin" },
    { key: "rain_gfs_mm", label: "GFS mm", numeric: true },
    { key: "imd_mean_mm", label: "IMD mean mm", numeric: true },
    { key: "bias_factor", label: "Bias factor", numeric: true },
    { key: "rain_gfs_bc_mm", label: "Bias-corrected mm", numeric: true },
    { key: "rain_icon_mm", label: "ICON mm", numeric: true },
    { key: "alert_gfs_bc", label: "GFS alert", alert: true },
    { key: "alert_icon", label: "ICON alert", alert: true }
];

const alertRank = {
    "NO ALERT": 0,
    "MODERATE": 1,
    "HEAVY": 2,
    "VERY HEAVY": 3,
    "EXTREMELY HEAVY": 4
};

let geojsonData = null;
let forecastData = [];
let filteredData = [];
let distributionData = [];
let rainfallMap = {};
let distributionMap = {};
let districtBasinMap = {};
let geoLayer = null;
let selectedDistrictKey = null;

const elements = {
    status: document.getElementById("status"),
    meta: document.getElementById("meta"),
    searchBox: document.getElementById("searchBox"),
    filterBox: document.getElementById("filterBox"),
    basinBox: document.getElementById("basinBox"),
    totalCount: document.getElementById("totalCount"),
    visibleCount: document.getElementById("visibleCount"),
    alertCount: document.getElementById("alertCount"),
    maxRain: document.getElementById("maxRain"),
    topDistrict: document.getElementById("topDistrict"),
    mapNote: document.getElementById("mapNote"),
    distributionNote: document.getElementById("distributionNote"),
    selectedDistrictSummary: document.getElementById("selectedDistrictSummary"),
    distributionChart: document.getElementById("distributionChart"),
    downloadDistrictDistribution: document.getElementById("downloadDistrictDistribution"),
    downloadAllDistribution: document.getElementById("downloadAllDistribution"),
    tableNote: document.getElementById("tableNote"),
    tableHead: document.getElementById("tableHead"),
    tableBody: document.getElementById("tableBody")
};

const map = L.map("map", {
    zoomControl: true,
    preferCanvas: true
}).setView([22, 80], 5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 10,
    attribution: "&copy; OpenStreetMap"
}).addTo(map);

function parseCsvText(text) {
    return Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        transformHeader: value => value.trim(),
        transform: value => typeof value === "string" ? value.trim() : value
    }).data;
}

function freshUrl(url) {
    const separator = url.includes("?") ? "&" : "?";
    return `${url}${separator}v=${DATA_CACHE_BUSTER}`;
}

async function fetchCsv(url) {
    const response = await fetch(freshUrl(url), { cache: "no-store" });
    if (!response.ok) {
        throw new Error(`${url} returned ${response.status}`);
    }
    return parseCsvText(await response.text());
}

async function fetchOptionalCsv(url) {
    try {
        return await fetchCsv(url);
    } catch {
        return [];
    }
}

async function fetchJson(url) {
    const response = await fetch(freshUrl(url), { cache: "no-store" });
    if (!response.ok) {
        throw new Error(`${url} returned ${response.status}`);
    }
    return response.json();
}

function toNumber(value) {
    const number = Number(value);
    return Number.isFinite(number) ? number : 0;
}

function formatNumber(value, digits = 2) {
    const number = Number(value);
    if (!Number.isFinite(number)) {
        return "";
    }
    return number.toLocaleString("en-IN", {
        maximumFractionDigits: digits,
        minimumFractionDigits: number === 0 ? 0 : Math.min(digits, 1)
    });
}

function normalizeAlert(value) {
    const text = String(value || "NO ALERT").trim().toUpperCase();
    return alertRank[text] === undefined ? "NO ALERT" : text;
}

function hasAlert(row) {
    return Math.max(
        alertRank[normalizeAlert(row.alert_gfs_bc)],
        alertRank[normalizeAlert(row.alert_icon)]
    ) > 0;
}

function maxAlertRank(row) {
    return Math.max(
        alertRank[normalizeAlert(row.alert_gfs_bc)],
        alertRank[normalizeAlert(row.alert_icon)]
    );
}

function alertClass(alert) {
    return `alert-${normalizeAlert(alert).toLowerCase().replaceAll(" ", "-")}`;
}

function rowKey(row) {
    return `${row.state || ""}||${row.district || ""}`;
}

function getColor(rain) {
    const value = toNumber(rain);
    if (value > 150) return "#7d3c98";
    if (value > 75) return "#c93a3a";
    if (value > 30) return "#e67e22";
    if (value > 5) return "#f2b705";
    return "#9bd7f0";
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function buildTableHead() {
    elements.tableHead.innerHTML = `<tr>${columns.map(col => `<th>${col.label}</th>`).join("")}</tr>`;
}

function buildTableRows(rows) {
    if (!rows.length) {
        elements.tableBody.innerHTML = `<tr><td colspan="${columns.length}">No districts match the selected filters.</td></tr>`;
        return;
    }

    elements.tableBody.innerHTML = rows.map(row => {
        const cells = columns.map(col => {
            let value = row[col.key];
            let className = col.numeric ? "num" : "";

            if (col.numeric) {
                value = formatNumber(value, col.key === "bias_factor" ? 3 : 2);
            }

            if (col.alert) {
                const alert = normalizeAlert(value);
                className = alert === "NO ALERT" ? "alert-none" : `alert ${alertClass(alert)}`;
                value = alert;
            }

            return `<td class="${className}">${escapeHtml(value)}</td>`;
        });

        const selectedClass = rowKey(row) === selectedDistrictKey ? " selected-row" : "";
        return `<tr class="${selectedClass}" data-key="${escapeHtml(rowKey(row))}">${cells.join("")}</tr>`;
    }).join("");
}

function markSelectedTableRow() {
    elements.tableBody.querySelectorAll("tr[data-key]").forEach(row => {
        row.classList.toggle("selected-row", row.dataset.key === selectedDistrictKey);
    });
}

function populateBasinOptions() {
    const basins = Array.from(new Set(Object.values(districtBasinMap)))
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b));

    elements.basinBox.innerHTML = `<option value="ALL">All basins</option>` +
        basins.map(basin => `<option value="${escapeHtml(basin)}">${escapeHtml(basin)}</option>`).join("");
}

function enrichForecastRows(rows) {
    return rows
        .filter(row => row.district && row.state)
        .map(row => {
            const basin = districtBasinMap[row.district] || "";
            return {
                ...row,
                basin,
                alert_gfs_bc: normalizeAlert(row.alert_gfs_bc),
                alert_icon: normalizeAlert(row.alert_icon),
                rain_gfs_mm: toNumber(row.rain_gfs_mm),
                imd_mean_mm: row.imd_mean_mm === "" ? "" : toNumber(row.imd_mean_mm),
                bias_factor: row.bias_factor === "" ? "" : toNumber(row.bias_factor),
                rain_gfs_bc_mm: toNumber(row.rain_gfs_bc_mm),
                rain_icon_mm: toNumber(row.rain_icon_mm)
            };
        });
}

function enrichDistributionRows(rows) {
    return rows
        .filter(row => row.district && row.state)
        .map(row => ({
            ...row,
            from_hour: toNumber(row.from_hour),
            to_hour: toNumber(row.to_hour),
            interval_label: row.interval_label || `${row.from_hour}-${row.to_hour} h`,
            rain_gfs_mm: toNumber(row.rain_gfs_mm),
            bias_factor: row.bias_factor === "" ? "" : toNumber(row.bias_factor),
            rain_gfs_bc_mm: toNumber(row.rain_gfs_bc_mm),
            rain_icon_mm: toNumber(row.rain_icon_mm),
            alert_gfs_bc: normalizeAlert(row.alert_gfs_bc),
            alert_icon: normalizeAlert(row.alert_icon)
        }))
        .sort((a, b) => (
            rowKey(a).localeCompare(rowKey(b)) ||
            a.from_hour - b.from_hour ||
            a.to_hour - b.to_hour
        ));
}

function buildDistributionMap(rows) {
    return rows.reduce((mapByDistrict, row) => {
        const key = rowKey(row);
        if (!mapByDistrict[key]) {
            mapByDistrict[key] = [];
        }
        mapByDistrict[key].push(row);
        return mapByDistrict;
    }, {});
}

function updateSummary(rows) {
    const alertRows = rows.filter(hasAlert);
    const topRow = rows.reduce((best, row) => (
        !best || row.rain_gfs_bc_mm > best.rain_gfs_bc_mm ? row : best
    ), null);

    elements.totalCount.textContent = forecastData.length.toLocaleString("en-IN");
    elements.visibleCount.textContent = rows.length.toLocaleString("en-IN");
    elements.alertCount.textContent = alertRows.length.toLocaleString("en-IN");
    elements.maxRain.textContent = topRow ? `${formatNumber(topRow.rain_gfs_bc_mm)} mm` : "0 mm";
    elements.topDistrict.textContent = topRow ? topRow.district : "-";

    const firstRow = forecastData[0];
    elements.meta.textContent = firstRow
        ? `Forecast ${firstRow.date || "-"} | Cycle ${firstRow.cycle_utc || "-"} UTC`
        : "";

    elements.tableNote.textContent = `${rows.length.toLocaleString("en-IN")} shown`;
    elements.mapNote.textContent = `${rows.length.toLocaleString("en-IN")} active`;
}

function chooseDefaultDistrict(rows) {
    return rows.reduce((best, row) => (
        !best || row.rain_gfs_bc_mm > best.rain_gfs_bc_mm ? row : best
    ), null) || rows[0] || null;
}

function matchesSearch(row, search) {
    if (!search) {
        return true;
    }

    return [row.district, row.state, row.basin]
        .some(value => String(value || "").toLowerCase().includes(search));
}

function matchesAlertFilter(row, filter) {
    const rank = maxAlertRank(row);

    if (filter === "ALERT") return rank > 0;
    if (filter === "MODERATE") return rank >= alertRank.MODERATE;
    if (filter === "HEAVY") return rank >= alertRank.HEAVY;
    if (filter === "RAIN50") return row.rain_gfs_bc_mm > 50;
    return true;
}

function applyFilters() {
    const search = elements.searchBox.value.trim().toLowerCase();
    const filter = elements.filterBox.value;
    const basin = elements.basinBox.value;

    filteredData = forecastData.filter(row => {
        const basinMatch = basin === "ALL" || row.basin === basin;
        return basinMatch && matchesSearch(row, search) && matchesAlertFilter(row, filter);
    });

    buildTableRows(filteredData);
    updateSummary(filteredData);
    drawMap();

    const selectedVisible = filteredData.some(row => rowKey(row) === selectedDistrictKey);
    if (!selectedVisible) {
        selectDistrict(chooseDefaultDistrict(filteredData));
    } else {
        const selectedRow = filteredData.find(row => rowKey(row) === selectedDistrictKey);
        renderDistribution(selectedRow);
        markSelectedTableRow();
    }
}

function drawMap() {
    if (!geojsonData) {
        return;
    }

    if (geoLayer) {
        map.removeLayer(geoLayer);
    }

    const activeDistricts = new Set(filteredData.map(row => row.district));
    const hasFilters = filteredData.length !== forecastData.length;

    geoLayer = L.geoJSON(geojsonData, {
        style: feature => {
            const name = feature.properties.NAME_2;
            const row = rainfallMap[name];
            const active = !hasFilters || activeDistricts.has(name);

            if (!row) {
                return {
                    fillColor: "#cfd6d0",
                    weight: 1,
                    color: "#777",
                    fillOpacity: active ? 0.45 : 0.06,
                    opacity: active ? 0.8 : 0.1
                };
            }

            const alert = normalizeAlert(row.alert_gfs_bc);
            const selected = rowKey(row) === selectedDistrictKey;
            return {
                fillColor: getColor(row.rain_gfs_bc_mm),
                weight: selected ? 3 : (hasAlert(row) ? 2 : 1),
                color: selected ? "#111111" : (alert !== "NO ALERT" ? "#b72121" : "#293530"),
                fillOpacity: active ? 0.72 : 0.06,
                opacity: active ? 0.85 : 0.12
            };
        },
        onEachFeature: (feature, layer) => {
            const name = feature.properties.NAME_2;
            const row = rainfallMap[name];

            if (!row) {
                layer.bindPopup(`<b>${escapeHtml(name)}</b><br>No forecast row found`);
                return;
            }

            layer.bindPopup(
                `<b>${escapeHtml(name)}</b><br>` +
                `${escapeHtml(row.state)}<br>` +
                `Basin: ${escapeHtml(row.basin || "-")}<br>` +
                `Bias-corrected rainfall: ${formatNumber(row.rain_gfs_bc_mm)} mm<br>` +
                `GFS alert: ${escapeHtml(row.alert_gfs_bc)}<br>` +
                `ICON alert: ${escapeHtml(row.alert_icon)}`
            );
            layer.on("click", () => selectDistrict(row));
        }
    }).addTo(map);
}

function selectDistrict(row) {
    if (!row) {
        selectedDistrictKey = null;
        renderDistribution(null);
        markSelectedTableRow();
        return;
    }

    selectedDistrictKey = rowKey(row);
    renderDistribution(row);
    markSelectedTableRow();
}

function renderDistribution(row) {
    if (!row) {
        elements.selectedDistrictSummary.textContent = "No district selected.";
        elements.distributionNote.textContent = "";
        elements.downloadDistrictDistribution.disabled = true;
        elements.downloadAllDistribution.disabled = distributionData.length === 0;
        elements.distributionChart.innerHTML =
            `<div class="chart-empty">Select a district to view the 3-hour distribution.</div>`;
        return;
    }

    const records = distributionMap[rowKey(row)] || [];
    elements.selectedDistrictSummary.textContent =
        `${row.district}, ${row.state} | 24h bias-corrected total: ${formatNumber(row.rain_gfs_bc_mm)} mm`;
    elements.distributionNote.textContent = records.length
        ? `${records.length} intervals`
        : "pending";
    elements.downloadDistrictDistribution.disabled = records.length === 0;
    elements.downloadAllDistribution.disabled = distributionData.length === 0;

    if (!records.length) {
        elements.distributionChart.innerHTML =
            `<div class="chart-empty">3-hour distribution will appear after the next forecast run.</div>`;
        return;
    }

    elements.distributionChart.innerHTML = buildDistributionSvg(records);
}

function buildDistributionSvg(records) {
    const width = 760;
    const height = 230;
    const margin = { top: 18, right: 20, bottom: 48, left: 48 };
    const plotWidth = width - margin.left - margin.right;
    const plotHeight = height - margin.top - margin.bottom;
    const values = records.flatMap(record => [record.rain_gfs_bc_mm, record.rain_icon_mm]);
    const maxRain = Math.max(1, ...values);
    const tickCount = 4;
    const barGap = 6;
    const step = plotWidth / records.length;
    const barWidth = Math.max(8, step - barGap);
    const y = value => margin.top + plotHeight - (value / maxRain) * plotHeight;
    const x = index => margin.left + index * step + (step - barWidth) / 2;
    const iconPoints = records
        .map((record, index) => `${margin.left + index * step + step / 2},${y(record.rain_icon_mm)}`)
        .join(" ");

    const yTicks = Array.from({ length: tickCount + 1 }, (_, index) => {
        const value = (maxRain / tickCount) * index;
        const yy = y(value);
        return `
            <line x1="${margin.left}" y1="${yy}" x2="${width - margin.right}" y2="${yy}" stroke="#edf0ed" />
            <text x="${margin.left - 8}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#5e6b66">${formatNumber(value, 1)}</text>
        `;
    }).join("");

    const bars = records.map((record, index) => {
        const barHeight = margin.top + plotHeight - y(record.rain_gfs_bc_mm);
        return `
            <rect x="${x(index)}" y="${y(record.rain_gfs_bc_mm)}" width="${barWidth}" height="${barHeight}" fill="rgba(31,122,77,0.72)">
                <title>${escapeHtml(record.interval_label)} | GFS BC: ${formatNumber(record.rain_gfs_bc_mm)} mm | ICON: ${formatNumber(record.rain_icon_mm)} mm</title>
            </rect>
        `;
    }).join("");

    const labels = records.map((record, index) => {
        const xx = margin.left + index * step + step / 2;
        const label = record.to_hour % 6 === 0 || records.length <= 8 ? record.interval_label : `${record.to_hour}h`;
        return `<text x="${xx}" y="${height - 20}" text-anchor="middle" font-size="10" fill="#5e6b66">${escapeHtml(label)}</text>`;
    }).join("");

    const iconLine = records.some(record => record.rain_icon_mm > 0)
        ? `
            <polyline points="${iconPoints}" fill="none" stroke="#c93a3a" stroke-width="2" />
            ${records.map((record, index) => `<circle cx="${margin.left + index * step + step / 2}" cy="${y(record.rain_icon_mm)}" r="2.5" fill="#c93a3a" />`).join("")}
        `
        : "";

    return `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="3-hour rainfall distribution chart">
            <rect x="0" y="0" width="${width}" height="${height}" fill="#fbfcfa" />
            ${yTicks}
            ${bars}
            ${iconLine}
            <line x1="${margin.left}" y1="${margin.top + plotHeight}" x2="${width - margin.right}" y2="${margin.top + plotHeight}" stroke="#9aa6a0" />
            <line x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${margin.top + plotHeight}" stroke="#9aa6a0" />
            ${labels}
            <text x="${margin.left}" y="13" font-size="11" fill="#1f7a4d">GFS bias-corrected bars</text>
            <text x="${width - margin.right}" y="13" text-anchor="end" font-size="11" fill="#c93a3a">ICON line</text>
        </svg>
    `;
}

function csvEscape(value) {
    const text = String(value ?? "");
    return /[",\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
}

function recordsToCsv(records) {
    const headers = [
        "state",
        "district",
        "from_hour",
        "to_hour",
        "interval_label",
        "rain_gfs_mm",
        "bias_factor",
        "rain_gfs_bc_mm",
        "rain_icon_mm",
        "alert_gfs_bc",
        "alert_icon",
        "date",
        "cycle_utc"
    ];

    return [
        headers.join(","),
        ...records.map(record => headers.map(header => csvEscape(record[header])).join(","))
    ].join("\n");
}

function downloadCsv(filename, records) {
    if (!records.length) {
        return;
    }

    const blob = new Blob([recordsToCsv(records)], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
}

function safeFilename(value) {
    return String(value || "district")
        .replace(/[^a-z0-9]+/gi, "_")
        .replace(/^_+|_+$/g, "")
        .toLowerCase();
}

function downloadSelectedDistribution() {
    if (!selectedDistrictKey) {
        return;
    }

    const records = distributionMap[selectedDistrictKey] || [];
    const district = records[0]?.district || selectedDistrictKey.split("||")[1];
    downloadCsv(`${safeFilename(district)}_3h_rainfall_distribution.csv`, records);
}

function downloadAllDistribution() {
    downloadCsv("india_3h_rainfall_distribution.csv", distributionData);
}

function bindEvents() {
    elements.searchBox.addEventListener("input", applyFilters);
    elements.filterBox.addEventListener("change", applyFilters);
    elements.basinBox.addEventListener("change", applyFilters);
    elements.tableBody.addEventListener("click", event => {
        const rowElement = event.target.closest("tr[data-key]");
        if (!rowElement) {
            return;
        }
        const row = forecastData.find(item => rowKey(item) === rowElement.dataset.key);
        selectDistrict(row);
    });
    elements.downloadDistrictDistribution.addEventListener("click", downloadSelectedDistribution);
    elements.downloadAllDistribution.addEventListener("click", downloadAllDistribution);
}

async function init() {
    try {
        const [basinRows, rainfallRows, distributionRows, districts] = await Promise.all([
            fetchCsv(BASIN_CSV),
            fetchCsv(DATA_CSV),
            fetchOptionalCsv(DISTRIBUTION_CSV),
            fetchJson(DISTRICTS_GEOJSON)
        ]);

        districtBasinMap = Object.fromEntries(
            basinRows
                .filter(row => row.district && row.basin)
                .map(row => [row.district, row.basin])
        );

        geojsonData = districts;
        forecastData = enrichForecastRows(rainfallRows);
        distributionData = enrichDistributionRows(distributionRows);
        rainfallMap = Object.fromEntries(forecastData.map(row => [row.district, row]));
        distributionMap = buildDistributionMap(distributionData);

        populateBasinOptions();
        buildTableHead();
        bindEvents();
        applyFilters();

        elements.status.textContent = "Data loaded successfully.";
    } catch (error) {
        console.error(error);
        elements.status.innerHTML = `<span class="error">Unable to load dashboard data: ${escapeHtml(error.message)}</span>`;
    }
}

init();
</script>
